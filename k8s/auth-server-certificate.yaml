apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: spotify-auth-tls
  namespace: snapserver
spec:
  secretName: spotify-auth-tls
  dnsNames:
    - spotify-auth
  duration: 2160h # 90d, cert-manager auto-renews
  renewBefore: 360h # 15d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
