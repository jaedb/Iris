# In-cluster replacement for the externally-hosted auth_spotify.php (was on
# the "fhem" host). Shared by all mopidy*-config ConfigMaps' [iris]
# spotify_authorization_url.
#
# Spotify requires Redirect URIs to use https:// (or a loopback literal),
# so this is served over TLS using a leaf cert from the internal CA set up
# in k8s/internal-ca.yaml + k8s/auth-server-certificate.yaml - not a
# publicly trusted one, since this hostname is LAN-only. Import
# internal-ca.crt (exported per k8s/internal-ca.yaml's instructions) into
# your browsers/devices once, or you'll get a cert warning.
#
# Prerequisite: create the spotify-auth Secret first (see
# k8s/auth-server-secret.example.yaml for the kubectl command - do not
# apply that file directly, it only has placeholder values).
#
# SPOTIFY_REDIRECT_URI below must exactly match the Redirect URI registered
# for this client_id in the Spotify Developer Dashboard. It assumes a DNS
# record "spotify-auth" pointing at the LoadBalancer IP this Service gets
# assigned (the same pattern as the existing mopidy1/snapserver/fhem
# hostnames) - update both if you use a different hostname.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-auth
  namespace: snapserver
spec:
  replicas: 1
  selector:
    matchLabels:
      run: spotify-auth
  template:
    metadata:
      labels:
        run: spotify-auth
    spec:
      containers:
        - name: spotify-auth
          image: k8s1:31320/spotify-auth:latest
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spotify-auth
                  key: client-id
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-auth
                  key: client-secret
            - name: SPOTIFY_REDIRECT_URI
              value: https://spotify-auth/auth_spotify.php
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: spotify-auth-tls
---
apiVersion: v1
kind: Service
metadata:
  name: spotify-auth
  namespace: snapserver
spec:
  type: LoadBalancer
  selector:
    run: spotify-auth
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
