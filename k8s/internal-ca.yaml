# Dedicated internal CA for LAN-only hostnames (not publicly reachable, so
# the existing letsencrypt-prod/-staging ClusterIssuers - which use HTTP-01
# against the public ingress - don't apply here).
#
# Bootstrap chain: a selfSigned Issuer mints the root CA's own Certificate,
# which backs a second ClusterIssuer ("internal-ca-issuer") that then signs
# leaf certs for things like spotify-auth. This is the standard cert-manager
# "becoming your own CA" pattern.
#
# After applying, export the root cert (public part only) for import into
# browsers/devices:
#   kubectl get secret internal-ca-secret -n cert-manager -o jsonpath='{.data.ca\.crt}' | base64 -d > internal-ca.crt
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-bootstrap
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Lerchenberg Internal CA
  secretName: internal-ca-secret
  duration: 87600h # 10y - this is a root, rotating it is disruptive
  renewBefore: 720h # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: internal-ca-issuer
spec:
  ca:
    secretName: internal-ca-secret
